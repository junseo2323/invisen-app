<main style="width: 100%; min-height: var(--screen-min-h); box-sizing: border-box; overflow-x: hidden; padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 32px; background: #0b0e12; color: #e3e7eb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;">

  <div style="display: flex; align-items: center; justify-content: space-between; margin: 0 -12px;">
    <a href="#/main" aria-label="뒤로" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #e3e7eb;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div aria-label="4단계 중 1단계" style="display: flex; align-items: center; gap: 4px; padding-right: 12px;">
      <div style="width: 20px; height: 3px; background: #e3e7eb;"></div>
      <div style="width: 20px; height: 3px; background: #2c333b;"></div>
      <div style="width: 20px; height: 3px; background: #2c333b;"></div>
      <div style="width: 20px; height: 3px; background: #2c333b;"></div>
    </div>
  </div>

  <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.01em;">인증번호를<br>입력해주세요</h1>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="phone" style="font-size: 14px; line-height: 22px; color: #a9b1bb;">휴대폰 번호</label>
    <div style="display: flex; gap: 8px;">
      <input id="phone" type="tel" value="010-2481-3307" style="flex: 1; min-width: 0; height: 56px; box-sizing: border-box; padding: 0 16px; background: #070a0d; border: 1px solid #5f6975; border-radius: 0; color: #e3e7eb; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 18px; font-weight: 500;">
      <button type="button" style="height: 56px; padding: 0 18px; background: #1c2127; border: 0; border-radius: 0; color: #e3e7eb; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);">재전송</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <label for="otp1" style="font-size: 14px; line-height: 22px; color: #a9b1bb;">인증번호</label>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; line-height: 22px; font-weight: 500; color: #a9b1bb;">2:48</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;">
      <input id="otp1" aria-label="인증번호 1번째 자리" inputmode="numeric" maxlength="1" value="4" style="width: 100%; height: 64px; box-sizing: border-box; text-align: center; background: #070a0d; border: 1px solid #5f6975; border-radius: 0; color: #e3e7eb; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 28px; font-weight: 600;">
      <input aria-label="인증번호 2번째 자리" inputmode="numeric" maxlength="1" value="8" style="width: 100%; height: 64px; box-sizing: border-box; text-align: center; background: #070a0d; border: 1px solid #5f6975; border-radius: 0; color: #e3e7eb; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 28px; font-weight: 600;">
      <input aria-label="인증번호 3번째 자리" inputmode="numeric" maxlength="1" value="1" style="width: 100%; height: 64px; box-sizing: border-box; text-align: center; background: #070a0d; border: 1px solid #5f6975; border-radius: 0; color: #e3e7eb; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 28px; font-weight: 600;">
      <input aria-label="인증번호 4번째 자리" inputmode="numeric" maxlength="1" value="7" style="width: 100%; height: 64px; box-sizing: border-box; text-align: center; background: #070a0d; border: 1px solid #5f6975; border-radius: 0; color: #e3e7eb; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 28px; font-weight: 600;">
      <input aria-label="인증번호 5번째 자리" inputmode="numeric" maxlength="1" value="" style="width: 100%; height: 64px; box-sizing: border-box; text-align: center; background: #070a0d; border: 2px solid #2bd8f0; border-radius: 0; color: #e3e7eb; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 28px; font-weight: 600;">
      <input aria-label="인증번호 6번째 자리" inputmode="numeric" maxlength="1" value="" style="width: 100%; height: 64px; box-sizing: border-box; text-align: center; background: #070a0d; border: 1px solid #5f6975; border-radius: 0; color: #e3e7eb; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 28px; font-weight: 600;">
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 14px; line-height: 22px; color: #a9b1bb; text-decoration: none;">번호가 바뀌었어요</a>
    <a href="#/login-profile" style="align-self: stretch; height: 56px; display: flex; align-items: center; justify-content: center; background: #e3e7eb; color: #0b0e12; text-decoration: none; font-size: 17px; line-height: 24px; font-weight: 700; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);">확인</a>
  </div>

</main>
