<main style="width: 100%; min-height: var(--screen-min-h); box-sizing: border-box; overflow-x: hidden; padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 32px; background: #0b0e12; color: #e3e7eb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;">

  <div style="display: flex; align-items: center; justify-content: space-between; margin: 0 -12px;">
    <a href="#main" aria-label="뒤로" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #e3e7eb;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div aria-label="4단계 중 1단계" style="display: flex; align-items: center; gap: 4px; padding-right: 12px;">
      <div style="width: 20px; height: 3px; background: #e3e7eb;"></div>
      <div style="width: 20px; height: 3px; background: #2c333b;"></div>
      <div style="width: 20px; height: 3px; background: #2c333b;"></div>
      <div style="width: 20px; height: 3px; background: #2c333b;"></div>
    </div>
  </div>

  <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.01em;">{{title1}}<br>{{title2}}</h1>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="phone" style="font-size: 14px; line-height: 22px; color: #a9b1bb;">휴대폰 번호</label>
    <div style="display: flex; gap: 8px;">
      <input id="phone" type="tel" value="{{phone}}" placeholder="010-0000-0000" autocomplete="tel" onInput="{{onPhone}}" style="flex: 1; min-width: 0; height: 56px; box-sizing: border-box; padding: 0 16px; background: #070a0d; border: 1px solid #5f6975; border-radius: 0; color: #e3e7eb; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 18px; font-weight: 500;">
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <label for="otp1" style="font-size: 14px; line-height: 22px; color: #a9b1bb;">등록 코드</label>
    </div>
    <div style="position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{boxes}}" as="b">
        <div aria-hidden="true" style="height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #070a0d; border: {{b.border}}; color: #e3e7eb; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 28px; font-weight: 600;">{{b.d}}</div>
      </sc-for>
      <input id="otp1" aria-label="등록 코드 6자리" inputmode="numeric" autocomplete="off" maxlength="6" value="{{code}}" onInput="{{onCode}}" onFocus="{{onFocus}}" onBlur="{{onBlur}}" disabled="{{codeDisabled}}" style="position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; opacity: 0; border: 0; padding: 0; font-size: 16px; color: transparent; background: transparent; caret-color: transparent;">
    </div>
    <sc-if value="{{error}}"><p role="alert" style="margin: 0; font-size: 14px; line-height: 22px; color: #ff5a4a;">{{error}}</p></sc-if>
    <sc-if value="{{info}}"><p role="status" style="margin: 0; font-size: 14px; line-height: 22px; color: #a9b1bb;">{{info}}</p></sc-if>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <a href="#" onClick="{{changed}}" style="height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 14px; line-height: 22px; color: #a9b1bb; text-decoration: none;">코드를 받지 못했어요</a>
    <button type="button" onClick="{{verify}}" disabled="{{verifyDisabled}}" style="align-self: stretch; height: 56px; display: flex; align-items: center; justify-content: center; background: #e3e7eb; color: #0b0e12; text-decoration: none; font-size: 17px; line-height: 24px; font-weight: 700; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%); border: 0; border-radius: 0; font-family: inherit; cursor: pointer; opacity: {{verifyOpacity}};">{{verifyLabel}}</button>
  </div>

</main>
