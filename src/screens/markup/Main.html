<main style="width: 100%; min-height: var(--screen-min-h); box-sizing: border-box; overflow-x: hidden; padding: 32px 24px 40px; display: flex; flex-direction: column; background: #0b0e12; color: #e3e7eb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;">

  <div class="stagger" style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 48px;">

    <img src="./logo.svg" alt="invisen" style="align-self: center; display: block; width: 160px; height: auto;">

    <div style="background: #13171c; box-shadow: inset 0 1px 0 #ffffff12; clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 0 100%); padding: 24px 24px 20px; display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-right: 12px; font-size: 13px; line-height: 20px;">
        <span style="color: #a9b1bb;">3구역 · PM10</span>
        <span style="display: flex; align-items: center; gap: 8px; color: #2bd8f0;"><span aria-hidden="true" class="live-dot" style="width: 6px; height: 6px; background: #2bd8f0; transform: rotate(45deg);"></span>LIVE</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <span style="font-size: 20px; line-height: 28px; font-weight: 700; color: #34c77b;">안전</span>
        <div style="display: flex; align-items: baseline; gap: 8px; font-family: 'IBM Plex Mono', ui-monospace, monospace;">
          <span style="font-size: 72px; line-height: 72px; font-weight: 600; letter-spacing: -0.03em;" data-count>38</span>
          <span style="font-size: 16px; line-height: 24px; font-weight: 500; color: #a9b1bb;">µg/m³</span>
        </div>
        <div aria-hidden="true" class="segs" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding-top: 4px;">
          <div style="height: 6px; background: #34c77b;"></div>
          <div style="height: 6px; background: #2c333b;"></div>
          <div style="height: 6px; background: #2c333b;"></div>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 1px solid #1c2127;">
        <span style="font-size: 14px; line-height: 22px; color: #a9b1bb;">오늘 누적</span>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div aria-hidden="true" style="width: 96px; height: 4px; background: #070a0d;"><div class="fill-x" style="width: 41%; height: 4px; background: #e3e7eb;"></div></div>
          <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; line-height: 20px; font-weight: 600;" data-count>41%</span>
        </div>
      </div>
    </div>

  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <a href="#login-phone" style="align-self: stretch; height: 56px; display: flex; align-items: center; justify-content: center; background: #e3e7eb; color: #0b0e12; text-decoration: none; font-size: 17px; line-height: 24px; font-weight: 700; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);">시작하기</a>
    <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 14px; line-height: 22px; color: #a9b1bb; text-decoration: none;">등록 문의</a>
  </div>

</main>
