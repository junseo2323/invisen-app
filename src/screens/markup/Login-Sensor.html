<main style="width: 100%; min-height: var(--screen-min-h); box-sizing: border-box; overflow-x: hidden; padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 32px; background: #0b0e12; color: #e3e7eb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;">

  <div style="display: flex; align-items: center; justify-content: space-between; margin: 0 -12px;">
    <a href="#/login-profile" aria-label="뒤로" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #e3e7eb;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div aria-label="4단계 중 3단계" style="display: flex; align-items: center; gap: 4px; padding-right: 12px;">
      <div style="width: 20px; height: 3px; background: #e3e7eb;"></div>
      <div style="width: 20px; height: 3px; background: #e3e7eb;"></div>
      <div style="width: 20px; height: 3px; background: #e3e7eb;"></div>
      <div style="width: 20px; height: 3px; background: #2c333b;"></div>
    </div>
  </div>

  <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.01em;">착용할 센서를<br>골라주세요</h1>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 22px; color: #a9b1bb;"><span aria-hidden="true" style="width: 6px; height: 6px; background: #2bd8f0; transform: rotate(45deg);"></span>{{foundLabel}}</span>
      <button type="button" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 4px; background: transparent; border: 0; color: #a9b1bb; font-family: inherit; font-size: 14px; cursor: pointer;" onClick="{{rescan}}" disabled="{{scanning}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg>다시 찾기
      </button>
    </div>

    <sc-for list="{{sensors}}" as="s" hint-placeholder-count="2">
      <button type="button" aria-pressed="{{s.selected}}" onClick="{{s.pick}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px; text-align: left; cursor: pointer; border-radius: 0; font-family: inherit; color: #e3e7eb; background: {{s.bg}}; border: 1px solid {{s.border}};">
        <span style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #070a0d;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e3e7eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10-5 5V2l5 5L7 17"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 16px; line-height: 22px; font-weight: 600;">{{s.id}}</span>
          <span style="font-size: 14px; line-height: 20px; color: #a9b1bb;">{{s.meta}}</span>
        </span>
        <span aria-hidden="true" style="width: 24px; height: 24px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{s.boxBg}}; border: 1.5px solid {{s.boxBd}};">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{s.checkColor}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </span>
      </button>
    </sc-for>
    <sc-if value="{{error}}"><p role="alert" style="margin: 8px 0 0; font-size: 14px; line-height: 22px; color: #ff5a4a;">{{error}}</p></sc-if>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 2fr; gap: 8px;">
    <a href="#" onClick="{{qr}}" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #1c2127; color: #e3e7eb; text-decoration: none; font-size: 17px; line-height: 24px; font-weight: 600; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><path d="M14 14h2v2M20 14v.01M14 20h.01M17 17h3v3h-3z"></path></svg>QR
    </a>
    <button type="button" onClick="{{connect}}" disabled="{{connectDisabled}}" style="height: 56px; display: flex; align-items: center; justify-content: center; background: #e3e7eb; color: #0b0e12; border: 0; border-radius: 0; font-family: inherit; cursor: pointer; opacity: {{connectOpacity}}; font-size: 17px; line-height: 24px; font-weight: 700; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);">{{connectLabel}}</button>
  </div>

</main>
