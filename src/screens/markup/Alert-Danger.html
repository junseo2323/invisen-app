<div role="alertdialog" aria-labelledby="alert-title" style="width: 100%; min-height: var(--screen-min-h); box-sizing: border-box; overflow-x: hidden; display: flex; flex-direction: column; background: #0b0e12; color: #e3e7eb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;">

  <div aria-hidden="true" style="height: 4px; flex-shrink: 0; background: repeating-linear-gradient(-45deg, #ff5a4a 0 6px, #0b0e12 6px 12px);"></div>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 28px; padding: 32px 24px 40px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="display: inline-flex; align-items: center; gap: 10px; height: 32px; padding: 0 14px 0 12px; background: #35110e; color: #ff5a4a; font-size: 15px; font-weight: 700; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);">
        <span aria-hidden="true" style="display: flex; gap: 2px;"><span style="width: 9px; height: 6px; background: #3f4852;"></span><span style="width: 9px; height: 6px; background: #3f4852;"></span><span style="width: 9px; height: 6px; background: #ff5a4a;"></span></span>위험
      </span>
      <span style="font-size: 13px; line-height: 20px; color: #a9b1bb;">{{time}}</span>
    </div>

    <h1 id="alert-title" style="margin: 0; font-size: 30px; line-height: 40px; font-weight: 700; letter-spacing: -0.01em;">지금 바로<br>{{zone}}에서 나와주세요</h1>

    <div style="background: #ff5a4a; padding: 2px; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);">
      <div style="background: #35110e; clip-path: polygon(0 0, calc(100% - 11.2px) 0, 100% 11.2px, 100% 100%, 0 100%); padding: 20px; display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 13px; line-height: 20px; color: #e3e7eb;">{{where}} · PM10</span>
        <div style="display: flex; align-items: baseline; gap: 8px; font-family: 'IBM Plex Mono', ui-monospace, monospace;">
          <span style="font-size: 80px; line-height: 80px; font-weight: 600; letter-spacing: -0.04em;">{{value}}</span>
          <span style="font-size: 18px; line-height: 24px; font-weight: 500; color: #e3e7eb;">µg/m³</span>
        </div>
        <span style="font-size: 15px; line-height: 22px; color: #ff5a4a; font-weight: 600;">권고치의 <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace;">{{percent}}%</span></span>
      </div>
    </div>

    <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 16px; background: #13171c; box-shadow: inset 0 1px 0 #ffffff12; text-decoration: none; color: #e3e7eb;">
      <span style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #070a0d;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e3e7eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 18-7-4-7 4z"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column;">
        <span style="font-size: 13px; line-height: 20px; color: #a9b1bb;">가장 가까운 안전 구역</span>
        <span style="font-size: 16px; line-height: 22px; font-weight: 600;">{{refuge}}</span>
      </span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 18px; line-height: 24px; font-weight: 600;">{{refugeDist}}</span>
    </a>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <button type="button" onClick="{{ack}}" style="width: 100%; height: 56px; display: flex; align-items: center; justify-content: center; background: #e3e7eb; color: #0b0e12; text-decoration: none; font-size: 17px; line-height: 24px; font-weight: 700; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%); border: 0; border-radius: 0; font-family: inherit; cursor: pointer;">확인했어요</button>
      <a href="#sos" style="height: 56px; display: flex; align-items: stretch; background: #35110e; text-decoration: none; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);">
        <span style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; color: #ff5a4a; font-size: 17px; line-height: 24px; font-weight: 700;"><span aria-hidden="true" style="width: 7px; height: 7px; background: #ff5a4a; transform: rotate(45deg);"></span>SOS 호출</span>
      </a>
    </div>

  </main>

</div>
