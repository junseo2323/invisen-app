        timeline: [['09:30:44', '개인 센서 96 감지'], ['09:30:45', '작업자 앱 알림'], ['09:31:10', '작업자 확인']] }
    ];
    const off = '#3f4852';
    const look = (it) => {
      const status = done[it.id] ? '처리 완료' : it.status;
      const pending = status === '대기';
      const danger = it.type === 'danger';
      const caution = it.type === 'caution';
      const lvl = danger || caution;
      return {
        status,
        pending,
        danger,
        bBg: danger ? '#35110e' : (caution ? '#2e2306' : '#1c2127'),
        bFg: danger ? '#ff5a4a' : (caution ? '#ffbe1a' : '#a9b1bb'),
        scaleDisplay: lvl ? 'flex' : 'none',
        s1: off,
        s2: caution ? '#ffbe1a' : off,
        s3: danger ? '#ff5a4a' : off,
        stFg: pending ? '#e3e7eb' : (status === '처리 완료' || status === '자동 해결' ? '#34c77b' : '#a9b1bb'),
        stW: pending ? 700 : 400
      };
    };
    const match = (it) => {
      const status = done[it.id] ? '처리 완료' : it.status;
      if (filter === 'all') return true;
      if (filter === 'pending') return status === '대기';
      return it.type === filter;
    };
    const rows = items.filter(match).map((it) => ({
      ...it,
      ...look(it),
      ai: !!it.ai,
      sel: it.id === sel,
      rowBg: it.id === sel ? '#0d2e35' : 'transparent',
      pick: () => this.setState({ sel: it.id })
    }));
    const cur = items.find((it) => it.id === sel) || items[0];
    const lk = look(cur);
    const d = {
      ...cur,
      ...lk,
      hasRec: !!cur.rec,
      hasPeople: cur.people.length > 0,
      metrics: cur.metrics.map(([k, v]) => ({ k, v })),
      people: cur.people.map((n) => ({ n, i: n.charAt(0) })),
      timeline: cur.timeline.map(([t, x], i) => ({ t, x, dot: i === cur.timeline.length - 1 ? '#e3e7eb' : '#5f6975' })).concat(done[cur.id] ? [{ t: '14:33:00', x: '박정민 반장이 처리 완료로 표시', dot: '#34c77b' }] : []),
      primary: cur.primary || '',
      primaryHref: cur.primaryHref || '#',
      resolve: () => this.setState({ done: { ...done, [cur.id]: true } })
    };
    const pendingCount = items.filter((it) => !done[it.id] && it.status === '대기').length;
    const defs = [['all', '전체 7'], ['pending', '대기 ' + pendingCount], ['danger', '위험 1'], ['caution', '주의 3'], ['sensor', '센서 2'], ['notice', '공지 1']];
    const filters = defs.map(([id, label]) => ({
      label,
      on: id === filter,
      bg: id === filter ? '#2c333b' : 'transparent',
      fg: id === filter ? '#e3e7eb' : '#a9b1bb',
      fw: id === filter ? 700 : 400,
      pick: () => this.setState({ filter: id })
    }));
    return { rows, d, filters };
  }
}
</script>
</body>
