<div style="min-height: 100vh; display: flex; flex-direction: column; background: #0b0e12; color: #e3e7eb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 40px; border-bottom: 1px solid #1c2127;">
    <img src="../logo.svg" alt="invisen" style="display: block; width: 96px; height: auto;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 14px; line-height: 20px; color: #a9b1bb;">{{admin}}</span>
      <a href="#login" onClick="{{logout}}" style="height: 40px; display: flex; align-items: center; padding: 0 14px; background: #1c2127; color: #e3e7eb; text-decoration: none; font-size: 14px; font-weight: 600;">로그아웃</a>
    </div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 72px 40px 64px; display: flex; flex-direction: column; gap: 40px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-size: 30px; line-height: 38px; font-weight: 700; letter-spacing: -0.01em;">현장을 골라주세요</h1>
      <span style="font-size: 15px; line-height: 22px; color: #a9b1bb;">{{subtitle}}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;">
      <sc-for list="{{sites}}" as="c">
      <sc-if value="{{c.active}}">
      <a href="#home" onClick="{{c.pick}}" style="position: relative; display: flex; flex-direction: column; gap: 20px; padding: 27px 28px 24px; background: #13171c; box-shadow: inset 0 1px 0 #ffffff12; color: #e3e7eb; text-decoration: none; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);">
        <span aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: {{c.bar}};"></span>
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #2bd8f0;"><span aria-hidden="true" style="width: 6px; height: 6px; background: #2bd8f0; transform: rotate(45deg);"></span>LIVE</span>
          <span style="display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 12px 0 10px; background: {{c.b.soft}}; color: {{c.b.color}}; font-size: 13px; font-weight: 700; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);"><span aria-hidden="true" style="display: flex; gap: 2px;"><span style="width: 7px; height: 5px; background: {{c.b.s1}};"></span><span style="width: 7px; height: 5px; background: {{c.b.s2}};"></span><span style="width: 7px; height: 5px; background: {{c.b.s3}};"></span></span>{{c.badge}}</span>
        </div>
        <svg viewBox="4 103 592 262" aria-hidden="true" style="display: block; width: 100%; height: auto; max-height: 110px;">
          <polygon points="16.8,177.4 30.4,172.8 44.2,168.5 58.0,164.3 71.9,160.4 85.8,156.8 99.9,153.3 113.9,150.1 128.0,147.2 142.2,144.4 156.4,141.9 170.7,139.7 184.9,137.6 199.3,135.9 213.6,134.3 228.0,133.0 242.3,131.9 256.7,131.1 271.2,130.5 285.6,130.1 300.0,130.0 314.4,130.1 328.8,130.5 343.3,131.1 357.7,131.9 372.0,133.0 386.4,134.3 400.7,135.9 415.1,137.6 429.3,139.7 443.6,141.9 457.8,144.4 472.0,147.2 486.1,150.1 500.1,153.3 514.2,156.8 528.1,160.4 542.0,164.3 555.8,168.5 569.6,172.8 583.2,177.4 527.9,338.1 516.9,334.4 505.8,330.9 494.7,327.6 483.5,324.5 472.3,321.5 461.0,318.8 449.7,316.2 438.4,313.8 427.0,311.6 415.5,309.6 404.1,307.8 392.6,306.1 381.1,304.7 369.5,303.5 358.0,302.4 346.4,301.5 334.8,300.9 323.2,300.4 311.6,300.1 300.0,300.0 288.4,300.1 276.8,300.4 265.2,300.9 253.6,301.5 242.0,302.4 230.5,303.5 218.9,304.7 207.4,306.1 195.9,307.8 184.5,309.6 173.0,311.6 161.6,313.8 150.3,316.2 139.0,318.8 127.7,321.5 116.5,324.5 105.3,327.6 94.2,330.9 83.1,334.4 72.1,338.1" fill="#1c2127"></polygon>
          <polygon points="472.0,147.2 481.4,149.1 490.8,151.2 500.1,153.3 509.5,155.6 518.8,158.0 528.1,160.4 537.4,163.0 546.6,165.7 555.8,168.5 565.0,171.3 574.1,174.3 583.2,177.4 527.9,338.1 520.6,335.7 513.2,333.3 505.8,330.9 498.4,328.7 491.0,326.6 483.5,324.5 476.1,322.5 468.6,320.6 461.0,318.8 453.5,317.0 445.9,315.4 438.4,313.8" fill="#2e2306"></polygon>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 20px; line-height: 28px; font-weight: 700;">{{c.name}}</span>
          <span style="font-size: 14px; line-height: 20px; color: #a9b1bb;">{{c.sub}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 20px; padding-top: 16px; border-top: 1px solid #1c2127; font-size: 14px; line-height: 20px; color: #a9b1bb;">
          <span>근무 중 <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; color: #e3e7eb;">{{c.working}}</span></span>
          <span>센서 <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; color: #e3e7eb;">{{c.sensors}}</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e3e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: auto;"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </div>
      </a>
      </sc-if>
      <sc-if value="{{c.preparing}}">
      <div aria-disabled="true" style="display: flex; flex-direction: column; gap: 20px; padding: 27px 28px 24px; background: #13171c; box-shadow: inset 0 1px 0 #ffffff12;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="height: 26px; display: inline-flex; align-items: center; padding: 0 10px; background: #1c2127; font-size: 13px; font-weight: 600; color: #a9b1bb;">준비 중</span>
        </div>
        <div aria-hidden="true" style="height: 110px; display: flex; align-items: center; justify-content: center; border: 1px dashed #2c333b;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5f6975" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 20px; line-height: 28px; font-weight: 700; color: #a9b1bb;">{{c.name}}</span>
          <span style="font-size: 14px; line-height: 20px; color: #a9b1bb;">{{c.sub}}</span>
        </div>
        <div style="padding-top: 16px; border-top: 1px solid #1c2127; font-size: 14px; line-height: 20px; color: #a9b1bb;">{{c.note}}</div>
      </div>
      </sc-if>
      </sc-for>
    </div>

    <a href="#" style="align-self: flex-start; height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #a9b1bb; text-decoration: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>현장 추가 문의
    </a>
  </main>

</div>
