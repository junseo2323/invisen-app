<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0b0e12; color: #e3e7eb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;">

  <aside style="flex: 1 1 232px; box-sizing: border-box; padding: 32px 16px 24px; display: flex; flex-direction: column; gap: 36px; border-right: 1px solid #1c2127;">
    <img src="../logo.svg" alt="invisen" style="display: block; width: 96px; height: auto; margin: 0 12px;">
    <nav aria-label="관리자 메뉴" style="display: flex; flex-direction: column; gap: 4px;">
      <a href="#home" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; color: #a9b1bb; text-decoration: none; font-size: 15px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="8" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"></rect><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"></rect><rect x="3.5" y="14.5" width="7" height="6" rx="1.5"></rect></svg>관제 홈
      </a>
      <a href="#workers" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; color: #a9b1bb; text-decoration: none; font-size: 15px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"></path></svg>작업자
      </a>
      <a href="#alerts" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; background: #1c2127; color: #e3e7eb; text-decoration: none; font-size: 15px; font-weight: 600;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 21h4"></path></svg>알림
        <sc-if value="{{nav.alerts}}"><span style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #2e2306; color: #ffbe1a; font-size: 12px; font-weight: 700;">{{nav.alerts}}</span></sc-if>
      </a>
      <a href="#reports" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; color: #a9b1bb; text-decoration: none; font-size: 15px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M14 3v5h5M9.5 13h6M9.5 17h4"></path></svg>보고서
      </a>
      <a href="#sensors" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; color: #a9b1bb; text-decoration: none; font-size: 15px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10-5 5V2l5 5L7 17"></path></svg>센서
      </a>
      <a href="#settings" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; color: #a9b1bb; text-decoration: none; font-size: 15px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>설정
      </a>
    </nav>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <a href="#sites" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #13171c; box-shadow: inset 0 1px 0 #ffffff12; color: #e3e7eb; text-decoration: none;">
        <span style="flex: 1; display: flex; flex-direction: column;">
          <span style="font-size: 15px; line-height: 22px; font-weight: 600;">{{nav.site}}</span>
          <span style="font-size: 13px; line-height: 20px; color: #a9b1bb;">현장 바꾸기</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a9b1bb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
      </a>
      <div style="display: flex; align-items: center; justify-content: space-between; padding-left: 12px;">
        <span style="font-size: 13px; line-height: 20px; color: #a9b1bb;">{{nav.admin}}</span>
        <a href="#login" onClick="{{nav.logout}}" style="height: 36px; display: flex; align-items: center; padding: 0 8px; font-size: 13px; color: #a9b1bb; text-decoration: none;">로그아웃</a>
      </div>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 40px 56px; display: flex; flex-direction: column; gap: 24px;">

    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.01em;">알림</h1>
        <span style="font-size: 14px; line-height: 20px; color: #a9b1bb;">{{subtitle}}</span>
      </div>
      <a href="#settings" style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 18px; background: #1c2127; color: #e3e7eb; text-decoration: none; font-size: 15px; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>알림 규칙
      </a>
    </header>

    <div role="group" aria-label="알림 종류" style="align-self: flex-start; display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: #13171c;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
        <button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="height: 36px; padding: 0 16px; border: 0; border-radius: 0; font-family: inherit; font-size: 14px; cursor: pointer; background: {{f.bg}}; color: {{f.fg}}; font-weight: {{f.fw}};">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">

      <section aria-label="알림 목록" style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; background: #13171c; box-shadow: inset 0 1px 0 #ffffff12; padding: 8px 0;">
        <span style="padding: 12px 24px 8px; font-size: 13px; line-height: 20px; color: #a9b1bb;">{{listLabel}}</span>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
          <button type="button" aria-pressed="{{r.sel}}" onClick="{{r.pick}}" style="width: 100%; display: flex; align-items: flex-start; gap: 16px; padding: 16px 24px; border: 0; border-top: 1px solid #1c2127; border-radius: 0; color: #e3e7eb; font-family: inherit; text-align: left; cursor: pointer; background: {{r.rowBg}};">
            <span style="width: 44px; flex-shrink: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; line-height: 24px; color: #a9b1bb;">{{r.t}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
              <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
                <span style="display: inline-flex; align-items: center; gap: 8px; height: 24px; padding: 0 10px 0 8px; background: {{r.bBg}}; color: {{r.bFg}}; font-size: 12px; font-weight: 700; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);"><span aria-hidden="true" style="display: {{r.scaleDisplay}}; gap: 2px;"><span style="width: 6px; height: 4px; background: {{r.s1}};"></span><span style="width: 6px; height: 4px; background: {{r.s2}};"></span><span style="width: 6px; height: 4px; background: {{r.s3}};"></span></span>{{r.cat}}</span>
                <sc-if value="{{r.ai}}" hint-placeholder-val="{{ false }}">
                  <span style="height: 24px; display: inline-flex; align-items: center; padding: 0 8px; background: #1c2127; font-size: 12px; font-weight: 600; color: #a9b1bb;">권고</span>
                </sc-if>
              </span>
              <span style="font-size: 15px; line-height: 22px; font-weight: 600;">{{r.title}}</span>
              <span style="font-size: 13px; line-height: 20px; color: #a9b1bb;">{{r.sub}}</span>
            </span>
            <span style="flex-shrink: 0; font-size: 13px; line-height: 24px; font-weight: {{r.stW}}; color: {{r.stFg}};">{{r.status}}</span>
          </button>
        </sc-for>
        <sc-if value="{{empty}}"><p style="margin: 0; padding: 16px 24px; border-top: 1px solid #1c2127; font-size: 14px; color: #a9b1bb;">{{emptyText}}</p></sc-if>
        <button type="button" onClick="{{toggleDay}}" style="display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border: 0; border-top: 1px solid #1c2127; border-radius: 0; background: transparent; color: #a9b1bb; font-family: inherit; font-size: 14px; cursor: pointer;">
          {{dayToggle}}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{dayArrow}};"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </section>

      <section aria-label="알림 상세" style="position: relative; flex: 1 1 400px; min-width: 0; background: #13171c; box-shadow: inset 0 1px 0 #ffffff12; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); padding: 28px; display: flex; flex-direction: column; gap: 22px;">
        <sc-if value="{{d.danger}}" hint-placeholder-val="{{ false }}">
          <span aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: repeating-linear-gradient(-45deg, #ff5a4a 0 6px, #0b0e12 6px 12px);"></span>
        </sc-if>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 8px; padding-right: 8px;">
            <span style="display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 12px 0 10px; background: {{d.bBg}}; color: {{d.bFg}}; font-size: 13px; font-weight: 700; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);"><span aria-hidden="true" style="display: {{d.scaleDisplay}}; gap: 2px;"><span style="width: 7px; height: 5px; background: {{d.s1}};"></span><span style="width: 7px; height: 5px; background: {{d.s2}};"></span><span style="width: 7px; height: 5px; background: {{d.s3}};"></span></span>{{d.cat}}</span>
            <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: #a9b1bb;">{{d.t}}</span>
            <span style="margin-left: auto; font-size: 13px; font-weight: {{d.stW}}; color: {{d.stFg}};">{{d.status}}</span>
          </div>
          <h2 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 700;">{{d.title}}</h2>
          <span style="font-size: 14px; line-height: 22px; color: #a9b1bb;">{{d.sub}}</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{d.metrics}}" as="m" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; background: #070a0d; min-width: 0;">
              <span style="font-size: 12px; line-height: 18px; color: #a9b1bb;">{{m.k}}</span>
              <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 16px; line-height: 24px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{m.v}}</span>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{d.hasRec}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; background: #070a0d;">
            <span style="height: 24px; display: inline-flex; align-items: center; padding: 0 8px; flex-shrink: 0; background: #1c2127; font-size: 12px; font-weight: 600; color: #a9b1bb;">권고</span>
            <span style="font-size: 14px; line-height: 22px;">{{d.rec}}</span>
          </div>
        </sc-if>

        <sc-if value="{{d.hasPeople}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <span style="font-size: 13px; line-height: 20px; color: #a9b1bb;">대상 작업자</span>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              <sc-for list="{{d.people}}" as="p" hint-placeholder-count="3">
                <a href="#worker-{{p.id}}" style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 4px; background: #1c2127; color: #e3e7eb; text-decoration: none; font-size: 14px; font-weight: 600;">
                  <span aria-hidden="true" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: #2c333b; font-size: 12px;">{{p.i}}</span>{{p.n}}
                </a>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 13px; line-height: 20px; color: #a9b1bb; padding-bottom: 6px;">처리 기록</span>
          <sc-for list="{{d.timeline}}" as="e" hint-placeholder-count="4">
            <div style="display: flex; gap: 14px; padding: 8px 0;">
              <span style="width: 64px; flex-shrink: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; line-height: 22px; color: #a9b1bb;">{{e.t}}</span>
              <span aria-hidden="true" style="width: 6px; height: 6px; margin-top: 8px; flex-shrink: 0; background: {{e.dot}}; transform: rotate(45deg);"></span>
              <span style="font-size: 14px; line-height: 22px;">{{e.x}}</span>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px;">
          <sc-if value="{{d.pending}}" hint-placeholder-val="{{ true }}">
            <a href="{{d.primaryHref}}" style="height: 48px; display: flex; align-items: center; padding: 0 22px; background: #e3e7eb; color: #0b0e12; text-decoration: none; font-size: 15px; font-weight: 700; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);">{{d.primary}}</a>
          </sc-if>
          <sc-if value="{{d.pending}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{d.resolve}}" style="height: 48px; padding: 0 20px; background: #1c2127; border: 0; border-radius: 0; color: #e3e7eb; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">처리 완료로 표시</button>
          </sc-if>
          <button type="button" onClick="{{print}}" style="height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 18px; background: #1c2127; border: 0; border-radius: 0; color: #e3e7eb; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>기록 PDF
          </button>
        </div>
      </section>

    </div>
  </main>
</div>
