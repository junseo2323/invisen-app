  </section>

  <section style="flex: 1 1 440px; min-width: 0; box-sizing: border-box; padding: 64px 24px; display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 32px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 14px; line-height: 20px; color: #a9b1bb;">관리자</span>
        <h1 style="margin: 0; font-size: 30px; line-height: 38px; font-weight: 700; letter-spacing: -0.01em;">로그인</h1>
      </div>

      <div style="display: flex; flex-direction: column; gap: 18px;">
        <label style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 14px; line-height: 20px; color: #a9b1bb;">아이디</span>
          <input id="username" type="text" value="{{username}}" onInput="{{onUser}}" onKeyDown="{{onKey}}" autocomplete="username" autocapitalize="off" spellcheck="false" style="height: 52px; box-sizing: border-box; padding: 0 16px; background: #070a0d; border: 1px solid #5f6975; border-radius: 0; color: #e3e7eb; font-family: inherit; font-size: 16px;">
        </label>
        <label style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 14px; line-height: 20px; color: #a9b1bb;">비밀번호</span>
          <input id="password" type="password" value="{{password}}" onInput="{{onPass}}" onKeyDown="{{onKey}}" autocomplete="current-password" style="height: 52px; box-sizing: border-box; padding: 0 16px; background: #070a0d; border: 1px solid #5f6975; border-radius: 0; color: #e3e7eb; font-family: inherit; font-size: 16px;">
        </label>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; line-height: 22px; cursor: pointer;">
          <input type="checkbox" checked="{{remember}}" onChange="{{onRemember}}" style="width: 20px; height: 20px; margin: 0; accent-color: #e3e7eb;">
          로그인 상태 유지
        </label>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <sc-if value="{{error}}"><p role="alert" style="margin: 0; font-size: 14px; line-height: 22px; color: #ff5a4a;">{{error}}</p></sc-if>
        <sc-if value="{{info}}"><p role="status" style="margin: 0; font-size: 14px; line-height: 22px; color: #a9b1bb;">{{info}}</p></sc-if>
        <button type="button" onClick="{{submit}}" disabled="{{busy}}" style="height: 56px; display: flex; align-items: center; justify-content: center; background: #e3e7eb; color: #0b0e12; text-decoration: none; font-size: 17px; font-weight: 700; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%); border: 0; border-radius: 0; font-family: inherit; cursor: pointer; opacity: {{opacity}};">{{label}}</button>
        <div style="display: flex; justify-content: center; gap: 8px; font-size: 14px; line-height: 20px; color: #5f6975;">
          <a href="#" onClick="{{forgot}}" style="height: 44px; display: flex; align-items: center; padding: 0 8px; color: #a9b1bb; text-decoration: none;">비밀번호를 잊었어요</a>
          <span aria-hidden="true" style="display: flex; align-items: center;">·</span>
          <a href="#" onClick="{{askAccount}}" style="height: 44px; display: flex; align-items: center; padding: 0 8px; color: #a9b1bb; text-decoration: none;">계정 문의</a>
        </div>
      </div>
    </div>
  </section>

</div>
