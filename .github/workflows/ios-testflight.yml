name: iOS TestFlight

# Builds the iOS app with the web app bundled inside (pointed at the production API) and
# uploads it to TestFlight. Run it from Actions › iOS TestFlight › Run workflow.
#
# Settings › Secrets and variables › Actions:
#   variables  API_URL          https://<app domain>   (the server with HTTPS)
#   secrets    ASC_KEY_ID       App Store Connect API key ID
#              ASC_ISSUER_ID    App Store Connect issuer ID
#              ASC_KEY_P8       the .p8 key file, base64:  base64 -i AuthKey_XXXX.p8 | pbcopy
#              APPLE_TEAM_ID    Apple Developer Team ID (10 characters)
# See docs/TESTFLIGHT.md.

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 테스터에게 보여줄 변경 내용 (What to Test)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      API_URL: ${{ vars.API_URL }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check settings
        run: |
          missing=""
          [ -n "$API_URL" ] || missing="$missing variable:API_URL"
          [ -n "$ASC_KEY_ID" ] || missing="$missing secret:ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing secret:ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing secret:ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing secret:APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::설정이 비어 있어요:$missing (docs/TESTFLIGHT.md 참고)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the web app into the iOS project
        run: VITE_API_URL="$API_URL" npm run ios:release

      - name: Write the App Store Connect key
        run: |
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and upload
        working-directory: ios/App
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          command -v fastlane >/dev/null || gem install fastlane --no-document
          fastlane beta

      - name: Keep build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: ~/Library/Logs/gym
          if-no-files-found: ignore

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
